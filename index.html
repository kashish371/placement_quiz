<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Aptitude Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Quiz Section -->

    <div class="container">

        <h1>Placement Aptitude Quiz</h1>

        <div class="top-bar">

            <div id="timer">25:00</div>

            <div>
                Total Questions:
                <span id="totalQuestions">30</span>
            </div>

        </div>

        <div class="quiz-box">

            <h2 id="question">
                Loading Question...
            </h2>

            <div id="options">

                <!-- Options Generated by JS -->

            </div>

            <div class="buttons">

                <button onclick="prevQuestion()">
                    Previous
                </button>

                <button onclick="markForReview()">
                    Mark For Review
                </button>

                <button onclick="skipQuestion()">
                    Skip
                </button>

                <button onclick="nextQuestion()">
                    Next
                </button>

                <button
                    class="submit-btn"
                    onclick="showResult()">

                    Submit Test

                </button>

            </div>

        </div>

        <!-- Question Palette -->

        <div class="palette-section">

            <h3>Question Palette</h3>

            <div id="palette"></div>

        </div>

        <!-- Legend -->

        <div class="legend">

            <div>
                <span class="legend-box current-box"></span>
                Current
            </div>

            <div>
                <span class="legend-box answered-box"></span>
                Answered
            </div>

            <div>
                <span class="legend-box review-box"></span>
                Review
            </div>

            <div>
                <span class="legend-box notvisited-box"></span>
                Not Visited
            </div>

        </div>

    </div>

    <!-- Result Page -->

    <div id="resultPage" class="hidden">

        <h1>Quiz Completed</h1>

        <h2 id="finalScore"></h2>

        <div id="review">

            <!-- Review Cards Generated Here -->

        </div>

    </div>

    <script src="percentage_questions.js"></script>

    <script src="script.js"></script>

</body>

</html>
